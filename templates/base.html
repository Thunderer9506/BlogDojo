<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon -->
    <link rel="icon" href="{{ url_for('static', filename='assets/Icon.jpg') }}" type="image/jpeg">
    <link rel="shortcut icon" href="{{ url_for('static', filename='assets/Icon.jpg') }}" type="image/jpeg">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='assets/Icon.jpg') }}">

    <!-- SEO Meta Tags -->
    <meta name="title" content="BlogDojo - A Personal Blog by Shaurya Srivastava">
    <meta name="description" content="Explore thoughts, tutorials, and insights on web development, Python, Flask, and more. A personal blog built with Flask and Firestore.">
    <meta name="keywords" content="blog, flask, python, web development, firestore, programming, tutorials">
    <meta name="author" content="Shaurya Srivastava">
    <meta name="robots" content="index, follow">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://blogdojo.onrender.com/">
    <meta property="og:title" content="BlogDojo - A Personal Blog by Shaurya Srivastava">
    <meta property="og:description" content="Explore thoughts, tutorials, and insights on web development, Python, Flask, and more.">
    <meta property="og:image" content="{{ url_for('static', filename='assets/og-image.png', _external=True) }}">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://blogdojo.onrender.com/">
    <meta property="twitter:title" content="BlogDojo - A Personal Blog by Shaurya Srivastava">
    <meta property="twitter:description" content="Explore thoughts, tutorials, and insights on web development, Python, Flask, and more.">
    <meta property="twitter:image" content="{{ url_for('static', filename='assets/og-image.png', _external=True) }}">

    <link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}">
    <script src="https://kit.fontawesome.com/acee086188.js" crossorigin="anonymous"></script>
    <!-- Include Quill CSS and JS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

    <title>BlogDojo - A Personal Blog</title>
  {# Page-specific CSS #}
  {% block extra_css %}{% endblock %}
</head>
<body>
  

  {% block content %}{% endblock %}

  <script src="{{url_for('static',filename='js/index.js')}}"></script>
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>

</body>
</html>
