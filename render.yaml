services:
  - type: web
    name: blogdojo
    env: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SERVICE_ACCOUNT_KEY_PATH
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: PORT
        value: 5000
